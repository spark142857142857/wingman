<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wingman</title>
  </head>
  <body>
    <div id="app">
      <main class="stage">
        <div id="terminal" class="terminal"></div>
      </main>
      <footer class="statusbar">
        <span>Shell: <strong id="shellLabel">PowerShell</strong></span>
        <span>Familiar: <strong id="familiarLabel" class="off">PAUSED</strong></span>
        <span class="cwd">start: <strong id="cwd">-</strong></span>
        <span class="hint">PowerShell preview: familiar on · default PAUSED · Ctrl+Shift+R new session</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
