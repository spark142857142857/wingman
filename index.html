<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wingman</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">W</span>
          <div>
            <strong>Wingman</strong>
            <p>Lightweight Windows Terminal</p>
          </div>
        </div>
        <div class="controls">
          <div class="segmented" role="tablist" aria-label="Shell">
            <button data-shell="powershell" class="active">PowerShell</button>
            <button data-shell="cmd">cmd</button>
          </div>
          <label class="toggle">
            <input id="compatToggle" type="checkbox" checked />
            <span>Linux Familiar</span>
          </label>
        </div>
      </header>
      <main class="stage">
        <div id="terminal" class="terminal glass"></div>
      </main>
      <footer class="statusbar">
        <span>Shell: <strong id="shellLabel">PowerShell</strong></span>
        <span>Compat: <strong id="compatLabel" class="ok">ON</strong></span>
        <span class="cwd">cwd: <strong id="cwd">-</strong></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
